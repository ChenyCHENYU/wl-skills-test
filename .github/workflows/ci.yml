name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: 安装锁定依赖
        run: npm ci --ignore-scripts
      - name: 运行完整测试（单元/集成/自一致性/MCP stdio/mock 后端）
        run: npm run verify
      - name: npm pack 校验（发布产物完整性）
        run: npm pack --dry-run --ignore-scripts

  publish:
    if: github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
      - run: npm ci --ignore-scripts
      - run: npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  compatibility:
    name: Published baseline upgrade and coexistence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run compatibility:check -- --output compatibility-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-evidence
          path: compatibility-evidence
